<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050810">
<title>Longwatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Big+Shoulders+Display:wght@700;800;900&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark}html,body{margin:0;background:#050810}
/* Layout concept: a naval-academy HUD around a literary story column.
   Condensed military sans for every game readout, a bookish serif for the story itself.
   Chamfered panel corners are the one HUD signature; each world re-tints --world. */
:root {
  --void: #070b16;
  --hull: #0d1426;
  --hull2: #141e37;
  --hull3: #1c2846;
  --line: #27355a;
  --line2: #3a4a76;
  --bone: #ece7da;
  --dim: #94a0bd;
  --faint: #66728f;
  --brass: #dca94b;
  --brass2: #8d6b2c;
  --world: #dca94b;
  --hp: #e5565f;
  --shield: #4cc9f0;
  --focus: #a98cff;
  --good: #5fd38d;
  --warn: #f0b24a;
  --bad: #ff6b6b;
  --r-common: #9aa5bd;
  --r-uncommon: #5fd38d;
  --r-rare: #4aa8ff;
  --r-epic: #b57cff;
  --r-legendary: #ffb347;
  --f-display: "Big Shoulders Display", "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
  --f-ui: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --f-prose: "Newsreader", Georgia, "Times New Roman", serif;
  color-scheme: dark;
}
body[data-world="cinder"] { --world: #ff7a45; }
body[data-world="veyra"] { --world: #4fe3a1; }
body[data-world="halcyon"] { --world: #ff5fb0; }
body[data-world="glasswake"] { --world: #78d7ff; }
body[data-world="sul"] { --world: #d9694f; }
body[data-world="lantern"] { --world: #b9a7ff; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  background: var(--void);
  color: var(--bone);
  font-family: var(--f-ui);
  font-size: 16px;
  line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  min-height: 100vh;
  overflow-x: hidden;
  
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 60; background: var(--hull);
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--world); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

#stars { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; opacity: .8; }
#app { position: relative; z-index: 1; max-width: 760px; margin: 0 auto; padding-bottom: 104px; }

/* chamfer helper */
.cham { clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); }
.cham-s { clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px); }

/* ---------- HUD ---------- */
#hud {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50;
  margin: 0 -16px; padding: 10px 16px 8px;
  background: linear-gradient(180deg, var(--hull) 0%, rgba(13,20,38,.97) 100%);
  border-bottom: 1px solid var(--line);
  box-shadow: 0 10px 24px rgba(0,0,0,.45);
}
#hud[hidden] { display: none; }
.hud-top { display: flex; align-items: center; gap: 10px; }
.emblem {
  width: 44px; height: 48px; flex: none; display: grid; place-items: center;
  background: var(--brass); color: #1b1304; font-family: var(--f-display); font-weight: 800; font-size: 24px;
  clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
  position: relative;
}
.emblem.pulse { animation: pulse 1.4s infinite; }
@keyframes pulse { 50% { filter: brightness(1.45) drop-shadow(0 0 8px var(--brass)); } }
.id { min-width: 0; flex: 1; }
.id .nm { font-family: var(--f-display); font-weight: 800; font-size: 20px; letter-spacing: .03em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.05; }
.id .rk { font-size: 13px; color: var(--dim); letter-spacing: .1em; text-transform: uppercase; font-weight: 600; }
.cr { text-align: right; font-weight: 700; font-size: 18px; color: var(--brass); font-variant-numeric: tabular-nums; letter-spacing: .02em; white-space: nowrap; }
.cr small { display: block; font-size: 11px; color: var(--faint); letter-spacing: .14em; font-weight: 600; }
.bars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
.bar { position: relative; height: 20px; background: #05080f; border: 1px solid var(--line); overflow: hidden; }
.bar > i { position: absolute; inset: 0 auto 0 0; width: 100%; transition: width .35s ease; }
.bar.hp > i { background: linear-gradient(90deg, #a52a35, var(--hp)); }
.bar.sh > i { background: linear-gradient(90deg, #1b7e9d, var(--shield)); }
.bar.fc > i { background: linear-gradient(90deg, #6045c4, var(--focus)); }
.bar span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 6px; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-shadow: 0 1px 2px #000; font-variant-numeric: tabular-nums; }
.bar span b { font-weight: 600; opacity: .85; }
.xpbar { height: 3px; background: #05080f; margin-top: 7px; position: relative; }
.xpbar > i { position: absolute; inset: 0 auto 0 0; background: var(--brass); transition: width .4s; }
.locline { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; color: var(--dim); }
.locline .loc { color: var(--world); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.locline .loc::before { content: "\25B8\00a0"; }
.locline .day { white-space: nowrap; color: var(--faint); }

/* ---------- Dock ---------- */
#dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 55;
  background: linear-gradient(0deg, var(--hull) 60%, rgba(13,20,38,.94));
  border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
}
#dock[hidden] { display: none; }
.dock-in { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
.dk { position: relative; background: transparent; border: 0; padding: 6px 0 4px; display: grid; justify-items: center; gap: 2px; color: var(--dim); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; font-weight: 600; min-height: 52px; }
.dk svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.dk:hover, .dk.on { color: var(--world); }
.dk .dot { position: absolute; top: 4px; right: calc(50% - 20px); min-width: 8px; height: 8px; border-radius: 4px; background: var(--brass); box-shadow: 0 0 8px var(--brass); }
.dk .dot[hidden] { display: none; }

/* ---------- Stage ---------- */
#stage { padding-top: 16px; animation: rise .35s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.eyebrow { font-size: 13px; letter-spacing: .22em; text-transform: uppercase; color: var(--world); font-weight: 700; display: flex; align-items: center; gap: 10px; }
.eyebrow::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--world), transparent); opacity: .6; }
h1.ttl { font-family: var(--f-display); font-weight: 900; font-size: clamp(38px, 11vw, 64px); line-height: .92; text-transform: uppercase; letter-spacing: .01em; margin: 8px 0 6px; text-wrap: balance; }
h2.ttl { font-family: var(--f-display); font-weight: 800; font-size: clamp(28px, 8vw, 40px); line-height: .98; text-transform: uppercase; margin: 8px 0 4px; text-wrap: balance; }
.prose { font-family: var(--f-prose); font-size: 19px; line-height: 1.62; max-width: 66ch; margin-top: 14px; font-optical-sizing: auto; }
.prose p { margin: 0 0 1em; }
.prose em { color: #f6efdc; }
.prose strong { color: #fff6df; font-weight: 600; }
.prose .say { padding-left: 14px; border-left: 2px solid var(--line2); }
.prose .say b { display: block; font-family: var(--f-ui); font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--world); font-weight: 700; margin-bottom: 1px; }
.prose .say.me { border-left-color: var(--brass); }
.prose .say.me b { color: var(--brass); }
.sysbox {
  font-family: var(--f-ui); font-size: 15px; letter-spacing: .05em; font-weight: 500;
  background: linear-gradient(90deg, rgba(76,201,240,.12), rgba(76,201,240,.03));
  border: 1px solid rgba(76,201,240,.35); border-left: 3px solid var(--shield);
  color: #bfeeff; padding: 8px 12px; margin: 0 0 1em; text-transform: uppercase; line-height: 1.35;
}
.sysbox b { color: #fff; font-weight: 700; }
.sysbox.gold { background: linear-gradient(90deg, rgba(220,169,75,.16), rgba(220,169,75,.03)); border-color: rgba(220,169,75,.4); border-left-color: var(--brass); color: #f7dca2; }
.sysbox.red { background: linear-gradient(90deg, rgba(229,86,95,.16), rgba(229,86,95,.03)); border-color: rgba(229,86,95,.4); border-left-color: var(--hp); color: #ffc3c6; }
.rewards { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 6px; }
.chip { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; padding: 3px 8px; border: 1px solid var(--line2); background: var(--hull2); color: var(--bone); white-space: nowrap; }
.chip.xp { color: var(--brass); border-color: var(--brass2); }
.chip.cr { color: var(--brass); border-color: var(--brass2); text-align: left; font-size: 13px; }
.chip.good { color: var(--good); border-color: #2a6b47; }
.chip.bad { color: var(--bad); border-color: #7d3030; }
.chip.world { color: var(--world); border-color: var(--world); }

/* ---------- Choices ---------- */
.choices { display: grid; gap: 9px; margin-top: 20px; }
.btn, .ch {
  position: relative; text-align: left; width: 100%;
  background: linear-gradient(180deg, var(--hull2), var(--hull));
  border: 1px solid var(--line2); color: var(--bone);
  padding: 13px 16px 13px 18px; font-size: 18px; font-weight: 500; letter-spacing: .01em; line-height: 1.25;
  clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
  transition: background .15s, transform .12s, border-color .15s;
}
.ch::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--world); opacity: .55; }
.ch:hover, .ch:active, .btn:hover { background: linear-gradient(180deg, var(--hull3), var(--hull2)); border-color: var(--world); transform: translateX(2px); }
.ch:hover::before { opacity: 1; }
.ch .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.tag { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; padding: 1px 7px; border: 1px solid currentColor; color: var(--dim); }
.tag.chk { color: var(--shield); }
.tag.trk { color: var(--brass); }
.tag.fight { color: var(--bad); }
.tag.aff { color: var(--good); }
.tag.cost { color: var(--brass); }
.ch.locked { opacity: .5; cursor: not-allowed; filter: saturate(.5); }
.ch.locked:hover { transform: none; border-color: var(--line2); background: linear-gradient(180deg, var(--hull2), var(--hull)); }
.ch.locked::before { background: var(--faint); }
.btn { text-align: center; font-family: var(--f-display); font-weight: 800; font-size: 20px; letter-spacing: .08em; text-transform: uppercase; padding: 12px 16px; }
.btn.pri { background: linear-gradient(180deg, #e9bc62, var(--brass)); color: #1b1304; border-color: #f0cb83; }
.btn.pri:hover { background: linear-gradient(180deg, #f3c870, #e5b254); transform: translateY(-1px); }
.btn.sm { font-size: 15px; padding: 7px 12px; letter-spacing: .1em; width: auto; display: inline-block; }
.btn.ghost { background: transparent; }
.btn[disabled] { opacity: .4; cursor: not-allowed; transform: none; }
.rowbtns { display: flex; flex-wrap: wrap; gap: 8px; }
.rowbtns .btn { width: auto; flex: 1 1 140px; }

/* dice result */
.dicecard { margin-top: 16px; border: 1px solid var(--line2); background: var(--hull); padding: 12px 14px; display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; }
.die { width: 62px; height: 70px; display: grid; place-items: center; background: var(--hull3); color: var(--bone); font-family: var(--f-display); font-weight: 900; font-size: 34px; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); }
.die.roll { animation: spin .5s ease; }
@keyframes spin { from { transform: rotate(-200deg) scale(.5); opacity: .3; } to { transform: none; opacity: 1; } }
.dicecard.win .die { background: var(--good); color: #052112; }
.dicecard.lose .die { background: var(--bad); color: #2b0606; }
.dicecard .lab { font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); font-weight: 700; }
.dicecard .math { font-size: 18px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
.dicecard .res { font-family: var(--f-display); font-weight: 800; font-size: 24px; text-transform: uppercase; letter-spacing: .06em; }
.dicecard.win .res { color: var(--good); }
.dicecard.lose .res { color: var(--bad); }

/* ---------- Title ---------- */
.title { min-height: calc(100vh - 160px); display: flex; flex-direction: column; justify-content: center; gap: 4px; padding-top: 0; }
.title .kicker { font-size: 14px; letter-spacing: .4em; text-transform: uppercase; color: var(--brass); font-weight: 700; }
.title h1 { font-family: var(--f-display); font-weight: 900; font-size: clamp(64px, 24vw, 150px); line-height: .82; text-transform: uppercase; margin: 6px 0 0; letter-spacing: -.01em; background: linear-gradient(180deg, #fff3d4 10%, var(--brass) 70%, #8d6b2c); -webkit-background-clip: text; background-clip: text; color: transparent; }
.title .sub { font-family: var(--f-prose); font-style: italic; font-size: 20px; color: var(--dim); max-width: 34ch; margin: 12px 0 22px; line-height: 1.4; }
.title .motto { font-size: 13px; letter-spacing: .3em; color: var(--faint); text-transform: uppercase; margin-top: 22px; font-weight: 600; }
.title .menu { display: grid; gap: 10px; max-width: 340px; }
.cover-rule { height: 2px; width: 120px; background: var(--brass); margin: 4px 0 6px; }

/* ---------- Forms ---------- */
.field { display: grid; gap: 6px; margin-top: 16px; }
.field label, .lab { font-size: 13px; letter-spacing: .18em; text-transform: uppercase; color: var(--dim); font-weight: 700; }
input[type=text], textarea {
  background: var(--hull); border: 1px solid var(--line2); color: var(--bone);
  font-family: var(--f-ui); font-size: 20px; font-weight: 500; padding: 11px 14px; width: 100%; border-radius: 0;
}
textarea { font-size: 14px; min-height: 120px; font-family: ui-monospace, Menlo, Consolas, monospace; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; background: var(--hull); border: 1px solid var(--line2); padding: 11px 14px; display: block; width: 100%; }
.opt b { font-family: var(--f-display); font-weight: 800; font-size: 21px; letter-spacing: .05em; text-transform: uppercase; display: block; }
.opt span { font-family: var(--f-prose); font-size: 16px; color: var(--dim); line-height: 1.4; display: block; margin-top: 2px; }
.opt em { display: block; font-style: normal; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--brass); font-weight: 700; margin-top: 5px; }
.opt.on { border-color: var(--brass); background: linear-gradient(180deg, #232034, var(--hull)); box-shadow: inset 3px 0 var(--brass); }
.opt:hover { border-color: var(--world); }

/* ---------- Combat ---------- */
.enemies { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; margin-top: 12px; }
.foe { position: relative; background: linear-gradient(180deg, var(--hull2), var(--hull)); border: 1px solid var(--line2); padding: 10px 12px 12px; text-align: left; width: 100%; display: block; }
.foe.sel { border-color: var(--bad); box-shadow: 0 0 0 1px var(--bad), 0 0 18px rgba(255,107,107,.25); }
.foe.dead { opacity: .3; filter: grayscale(1); }
.foe.boss { border-color: var(--brass2); }
.foe .fn { font-family: var(--f-display); font-weight: 800; font-size: 20px; text-transform: uppercase; letter-spacing: .04em; line-height: 1.05; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.foe .fn small { font-family: var(--f-ui); font-size: 12px; letter-spacing: .14em; color: var(--dim); white-space: nowrap; }
.foe .fam { font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--faint); font-weight: 600; }
.foe .bar { height: 16px; margin-top: 6px; }
.foe .bar span { font-size: 11px; }
.intent { margin-top: 8px; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; color: var(--warn); display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.intent b { color: #ffe6ac; font-weight: 700; }
.intent .est { color: var(--bad); }
.sts { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; min-height: 0; }
.st { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; padding: 1px 6px; background: #1a2237; border: 1px solid var(--line2); color: var(--dim); }
.st.bad { color: var(--bad); border-color: #7d3030; }
.st.good { color: var(--good); border-color: #2a6b47; }
.floater { position: absolute; right: 14px; top: 8px; font-family: var(--f-display); font-weight: 900; font-size: 30px; pointer-events: none; animation: floatup 1s ease-out forwards; text-shadow: 0 2px 4px #000; z-index: 3; }
.floater.crit { font-size: 40px; color: var(--brass); }
.floater.hit { color: #ffd2d2; }
.floater.heal { color: var(--good); }
@keyframes floatup { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-34px); } }
.shake { animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.me-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; align-items: center; }
.me-row .lab { margin-right: 4px; }
.actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.act { background: linear-gradient(180deg, var(--hull3), var(--hull2)); border: 1px solid var(--line2); padding: 10px 6px; text-align: center; font-family: var(--f-display); font-weight: 800; font-size: 19px; letter-spacing: .08em; text-transform: uppercase; min-height: 54px; clip-path: polygon(7px 0, 100% 0, 100% calc(100% - 7px), calc(100% - 7px) 100%, 0 100%, 0 7px); }
.act small { display: block; font-family: var(--f-ui); font-size: 11px; letter-spacing: .12em; color: var(--dim); font-weight: 600; }
.act:hover { border-color: var(--world); }
.act.pri { background: linear-gradient(180deg, #e9bc62, var(--brass)); color: #1b1304; border-color: #f0cb83; }
.act.pri small { color: #4a3510; }
.act[disabled] { opacity: .38; cursor: not-allowed; }
.sublist { display: grid; gap: 7px; margin-top: 10px; }
.sub-i { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; text-align: left; background: var(--hull); border: 1px solid var(--line2); padding: 9px 12px; width: 100%; }
.sub-i b { font-family: var(--f-display); font-weight: 800; font-size: 19px; letter-spacing: .04em; text-transform: uppercase; }
.sub-i .meta { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--brass); font-weight: 700; text-align: right; white-space: nowrap; }
.sub-i .d { grid-column: 1 / -1; font-family: var(--f-prose); font-size: 15px; color: var(--dim); line-height: 1.35; }
.sub-i[disabled] { opacity: .4; cursor: not-allowed; }
.sub-i:not([disabled]):hover { border-color: var(--world); }
.clog { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 8px; font-size: 16px; line-height: 1.35; display: grid; gap: 3px; max-height: 190px; overflow: auto; }
.clog div { color: var(--dim); }
.clog div:last-child, .clog div.n { color: var(--bone); }
.clog .p { color: #bfe9ff; }
.clog .e { color: #ffb6a8; }
.clog .g { color: var(--good); }
.clog .y { color: var(--brass); }
.clog .turn { color: var(--faint); letter-spacing: .2em; text-transform: uppercase; font-size: 12px; font-weight: 700; padding-top: 4px; }

/* ---------- Hub ---------- */
.hubgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 16px; }
.hubtile { text-align: left; background: linear-gradient(180deg, var(--hull2), var(--hull)); border: 1px solid var(--line2); padding: 12px 14px; min-height: 92px; position: relative; display: block; width: 100%; }
.hubtile:hover { border-color: var(--world); }
.hubtile b { font-family: var(--f-display); font-weight: 800; font-size: 22px; text-transform: uppercase; letter-spacing: .05em; display: block; }

CX('concord', 'Powers', 'The Concord of Meridian', 'Nine hundred settled systems under one Assembly, one law and one fleet. Founded after the Long Quiet, when the Vael vanished and left the stars to whoever dared claim them. The Concord keeps the peace by inertia, committee, and a very large navy.');
CX('navy', 'Powers', 'The Line (Concord Navy)', 'The Concord Navy, nicknamed the Line, because it holds one: the frontier. Its officers are drawn from five Academies. The farthest, and least fashionable, is Longwatch.');
CX('hegemony', 'Powers', 'The Sul Hegemony', 'Across the Reach, a militarized state ruled by the Ascendancy. Sul speaks of unity, order and ascent. Its soldiers are conscripts; its marshals are not. Border wars simmer for decades without ever quite boiling.');
CX('drift', 'Powers', 'The Free Ports', 'A loose confederation of ring-stations and traders. Law is whatever the Matron says it is. Cash, favors and silence are all currencies. The Concord tolerates them because the alternative is worse.');
CX('vess', 'Species', 'The Vess', 'Tall, bioluminescent, and musical. Vess speak in layered tones, and say they have never told a lie. They grow their tools and their war-beasts. Veyra is the home of the seven great hive-clans.');
CX('vael', 'History', 'The Vael', 'A civilization older than any record. They built the Lanterns, megastructures of light, then vanished. Their remains are all that is left to explain them. The Concord has never found a Vael body.');
CX('lanternchord', 'History', 'The Lantern Chord', 'A signal from the dark Lantern at the edge of the Reach. It resumed ninety days ago after four thousand years of silence. Every instrument that hears it records the same seven notes.');
CX('reach', 'Places', 'The Reach', 'The frontier region at the edge of settled space. Beyond it lies the Dark Between, a gulf of unmapped void. Every Concord ship that has gone into the dark has come back missing a crew or not at all.');
CX('longwatch', 'Places', 'Longwatch Station', 'A rotating wheel-station around the gas giant Aster, home to the Longwatch Academy. Motto: We keep the light on. Cadets who finish here staff the Reach, whether they want to or not.');
CX('perihelion', 'Places', 'CSV Perihelion', 'A thirty-year-old training frigate, last refit in the previous administration. Her captain jokes that she is held together by habit and good intentions.');
CX('halo', 'Tech', 'Halo Interface', 'The neural overlay every cadet receives on arrival. It tracks stats, skill ratings and objectives, and delivers a running commentary in a courteous, faintly sarcastic voice. It is also how the Academy knows where you are.');
CX('skein', 'Tech', 'The Skein', 'The network of fold-routes that makes faster-than-light travel possible. Jumps are quick and reliable. Their cost is that no one remembers them clearly.');
CX('dmgtypes', 'Tech', 'Damage Types', 'Four categories: Kinetic (slugs, blades), Energy (lasers, pulses), Plasma (thermal), and Ion (system disruption). Enemies have weaknesses and resistances. Machines hate ion. Beasts often fear fire.');
CX('orders', 'Tech', 'Squad Orders', 'In a fight, your squad acts on your cue. Each order has its own cooldown. A high-presence officer gets more from them. A bonded squad gets even more.');
CX('hollow', 'History', 'The Hollow', 'Reports from the Reach describe derelicts that stir when no one is aboard, drones that change their song, and crews who talk in their sleep. The Concord officially calls them "autonomous derelict hazards". Everyone else says the Hollow.');
CX('glasswake_c', 'History', 'The Battle of Glasswake', 'Twenty-two years ago, the dreadnought Ardent led a squadron to investigate a distress call from the ice moon Glasswake. Nobody answered the next hail. A single lifepod made it back, with one terrified ensign.');
CX('tarrant', 'People', 'Master Chief Dov Tarrant', 'The Academy’s senior drill instructor. Twenty-six years in uniform. He has said "good" to exactly four cadets, none of them in public.');
CX('quill', 'People', 'Commandant Imara Quill', 'Commandant of Longwatch. A hero of the border wars who now fights budget committees. Wears her medals only when it makes someone else uncomfortable.');
CX('anselm', 'People', 'Captain Beatrix Anselm', 'Commander of the Perihelion. Late of the Ardent, early of everything else. Her sense of humor is a tool, not a personality.');
CX('brandt', 'People', 'Matron Ossa Brandt', 'Queen of Halcyon Drift. Her laws are written nowhere and obeyed everywhere. She remembers every favor and every slight.');
CX('kaldor_c', 'People', 'Marshal Dray Kaldor', 'Commander of the Hegemony’s Meridian front. Believes the Hegemony is the only thing standing between the galaxy and chaos. Has believed this for forty years.');
CX('vos_c', 'People', 'Lieutenant Ilyra Vos', 'A border officer of the Hegemony, young for her rank and unusually careful with her troops. She keeps a notebook of the names of every soldier she has lost.');
CX('cinder_c', 'Places', 'Cinder', 'A volcanic mining colony whose refineries feed half the sector. The Cinder Free Union has been asking for safer tunnels, fair pay and a vote for eleven years. The Concord has been asking them to be patient for eleven years.');
CX('veyra_c', 'Places', 'Veyra', 'A jungle-moon of towering canopy trees and amber rivers. Concord survey teams have been coming for a century. The seven Vess clans have been asking them to leave for about as long.');
CX('halcyon_c', 'Places', 'Halcyon Drift', 'A ring-city older than the Concord charter, run by the Drift Syndicate. Everything is for sale. Most things are also on fire at some point.');
CX('glasswake_m', 'Places', 'Glasswake', 'An ice moon on the edge of the Reach. The wreck of the Ardent hangs in its glacial canyon. Frozen. Not quiet.');
CX('sul_c', 'Places', 'Sul Meridian', 'A desert world on the Hegemony border, home to relay beacons, fuel depots and the occasional fortified hill. The Concord and the Hegemony have shot at each other here for forty years without winning.');
CX('lantern_m', 'Places', 'The Lantern', 'A Vael megastructure shaped like a lighthouse the size of a small moon. It orbits a dying star at the edge of the Reach. For four thousand years it has been dark. Not anymore.');
CX('vigil_c', 'People', 'VIGIL', 'The Lantern’s guardian intelligence. A Vael mind, patient and unfathomably old. It was built to keep a watch. It has been keeping it for forty centuries.');
CX('wardens', 'History', 'The Wardens', 'The Lantern’s guardian constructs. They were meant to guard travelers through the Dark Between. When the Lantern began to dim, some stopped listening.');
CX('darkbetween', 'History', 'The Dark Between', 'The gulf beyond the Reach. Nothing in it is mapped. Every attempt to cross it has ended in silence. The Vael, apparently, built the Lanterns to keep something in, or out.');
CX('ardent_c', 'History', 'CSV Ardent', 'A Meridian-class dreadnought, 900 meters of the best armor the Concord could forge. Lost at Glasswake. Her wreck has not been touched in twenty-two years.');
CX('syndicate', 'Powers', 'The Drift Syndicate', 'The governing criminal confederacy of Halcyon Drift. Officially a trade guild. Unofficially, everything else.');
CX('union', 'Powers', 'The Cinder Free Union', 'The miners’ union of Cinder, organized after the Collapse of ’33. Fifteen thousand members. Mostly reasonable. Increasingly not.');
CX('reed', 'Species', 'Reedweave', 'Vess biocraft: living crystal grown on reed-frames into blades, armor and tools. It responds to its wearer’s emotions. A gift of reedweave is never casual.');

S.c3_shaft = {

  fx: [['loc', 'Cinder · Shaft Nine', 'cinder'], ['xpl', .05]],
  t: `Shaft Nine is a ragged hole in the world, ringed by scaffolding and floodlights. Wind blows up out of it, hot and smelling of deep stone.

Union miners crowd the wellhead: two hundred of them, praying, shouting, passing around thermoses of weak coffee. A Marine detail stands thirty meters back at the Governor’s order. The hoist, a great steel cage that should carry you down, hangs half-collapsed on its cable.

Odalys finds you before the Foreman does.

@Odalys Pry: “The cage jammed when the collapse hit. We have been lowering ropes for six hours, but the heat is killing the rescuers. Forty people down there. Two of them kids on their first shift.”

Her voice is steady. Her hands are not.

S.c3_logs = {
  eb: 'Chapter Three · The Refuge Chamber',
  t: `Against the wall of the chamber, a dented pad lies in a pool of lamplight. Shift Supervisor Hollis’s datapad: scratched, flashing, still logged in.

Tamsin picks it up. She frowns.

@Tamsin: “It’s a maintenance log. The gas sensors on Level Forty-One were flagged offline for sixty days.” Her thumb skims. “Somebody signed off on the override. Quarterly cost report. ‘Production sustained.’”

She holds it out. At the bottom, a name: *V. Consolidated, Authorized: P. Varga.*

@Dex: “So the Governor’s company turned off the safety sensors to hit quota?”

The pad is encrypted behind a layered lock. The signature could be forged. The proof would be real.`,

      t: 'Decrypt the pad.', chk: {

        bad: { t: 'You crack the first layers and the second locks you out. A partial copy survives: enough to raise questions. Not enough to end them.', fx: [['flag', 'evidence_partial'], ['xpl', .04]], go: 'c3_standoff' }

};

S.c3_standoff = {
  eb: 'Chapter Three · The Wellhead',
  fx: [['loc', 'Cinder · Shaft Nine, Surface', 'cinder']],
  t: `You come out into the grey light with the last of the miners, blinking at an apocalypse of cheering.

It does not last. At the edge of the wellhead, the Governor’s Marines have formed a line. Across from them, Kell’s Union militia, miners with rifles and drilling lances, have formed another. The air between them is a taut wire.

@Governor Varga: “Cadets! Excellent work. Now, if you will bring me any evidence of interference below, I will see to it that the Union’s criminals are held accountable.” His smile is a coin. “I assume you found something.”

@Dorn Kell: “Don’t hand it to him.” His voice is low and hoarse. “I’ve had eleven years of promises. I won’t have another thirty minutes of them.”

The pad is warm in your hand. Both men are watching it.`,
  ch: [
    { t: 'Give the evidence to Kell. The truth belongs to the miners.', go: 'c3_quake', req: { any: [{ flag: 'evidence' }, { flag: 'evidence_partial' }] }, fx: [['flag', 'cinder_mercy'], ['rep', 'drift', 1], ['rep', 'concord', -1], ['aff', 'kesh', 1], ['aff', 'tamsin', -1], ['ach', 'mercy_cinder'], ['xpl', .12], ['log', 'Gave the Varga logs to the Cinder Free Union.']] },

S.c3_force = {
  eb: 'Chapter Three · The Wellhead',
  t: `The Governor’s Marines fire first, or the Union does. Afterward nobody can remember. It is an ugly, fast, noisy thing: lances and carbines, shouts, the sound of a hundred people not knowing what to do with their fear.

The Union militia breaks toward you. Kell’s lieutenants. Their faces are not angry. They are desperate. That is worse.

@Tamsin: “They’re miners. Half of them don’t even know how to hold the rifles.”

@Kesh: “We must stop this.”

@Dex: “Then, uh, stop it?”

You cannot stop it any other way now.`,
  ch: [{ t: 'Put down the militia.', fight: F(['unionrifle', 'unionrifle', 'unionshock'], 'c3_kell', { intro: 'The militia charges. Rifles crack. A drill-lance whines to life.', noflee: true }) }]
};

  fx: [['ach', 'order_cinder']],
  t: `The line breaks. The militia scatters. Only one man stands in the road: Dorn Kell, drill-lance in his hands, ash in his beard, his eyes full of a grief so old it has no edges left.

@Dorn Kell: “You were supposed to be different.” His voice is quiet. “You were supposed to be the ones who were different.”

S.c3_quake = {
  eb: 'Chapter Three · The Quake',
  fx: [['xpl', .1]],
  t: `The ground moves.

It is a low, long, tooth-rattling shudder. The wellhead scaffolding sways. Somewhere underneath you, something very large turns over in its sleep and wakes up.

@Odalys Pry: “That is not the shaft.” She has gone the color of paper. “That is not the shaft. That is the Magmaw.”

Every miner on the terraces knows the name. A legend told to children to keep them from the vents. An animal the size of a tram that lives on the deepest ledge and eats whatever the rock does not.

The earth bulges. The wellhead cracks. A mouth the width of a hangar bay rises through the stone, rimmed with molten teeth.

All the standoff in the world vanishes. There is only the roar, and the heat, and the beast.`,
  ch: [
    { t: 'Rally the Union beside you.', fight: F(['magmaw'], 'c3_after', { intro: 'The Magmaw erupts. Union miners and Marines both scramble back. Kell’s militia stands beside you.', sc: .62, noflee: true }), req: { flag: 'cinder_mercy' }, hide: true },
    { t: 'Rally everyone. Stand your ground.', fight: F(['magmaw'], 'c3_after', { intro: 'The Magmaw erupts. Marines and miners scatter. You are the line.', sc: .7, noflee: true }), req: { flag: 'cinder_neutral' }, hide: true },
    { t: 'Hold the line alone.', fight: F(['magmaw'], 'c3_after', { intro: 'The Magmaw erupts. The Union has been broken. The Marines are running. It is you and your squad.', sc: .8, noflee: true }), req: { flag: 'cinder_order' }, hide: true }
  ]
};

S.c3_after = {
  eb: 'Chapter Three · Aftermath',
  fx: [['xpl', .15], ['cr', 250], ['item', 'w_plasma'], ['item', 'a_ashguard'], ['ach', 'ch_cinder'], ['day', 3], ['act', 3], ['visit', 'cinder'], ['next', 'c4_start', 'Veyra: The Canopy', 'A survey team has gone missing in the Vess canopy, and Kesh has been asked to speak for them.'], ['log', 'Survived the Magmaw and ended the Cinder crisis.']],
  t: (g) => {
    let t = `The Magmaw falls into the crater it dug, and the crater closes over it like a mouth. Silence. Then ash, lots of it, drifting down on the wellhead like a slow grey benediction.

`;
    if (g.flags.cinder_mercy) t += `Kell stands at the edge of the hole, drill-lance trailing, looking at the evidence pad in his hand. Odalys is beside him. On the other side of the field, the Governor’s Marines have lowered their weapons and are looking at their own commanding officer, who has just discovered that his political career is about to end in a very public way.

@Dorn Kell: “You could have kept the truth for yourself.” He doesn’t look up. “Thank you, Cadet. The Union does not forget a debt.”

`;
    else if (g.flags.cinder_neutral) t += `Captain Anselm’s shuttle lands as the ash settles, with a full inquiry team and a very polite arrest warrant. The Governor goes quietly. The Union stands down, uncertain whether this is a victory or a very careful trap.

@Captain Anselm: “Cadets. You may have just saved the colony from itself.” She is trying not to smile. “Well done.”

`;
    else t += `Kell lies unconscious, bound by his own Union’s medics, a wreck of a man. The Governor takes the evidence pad from you with an air of satisfaction and a hand that is a little too eager. Nobody mentions what happened to the Union’s militia. The miners watch you leave without a word.

@Tamsin: “That was the right call.” She says it quietly. She does not sound sure.

`;
    if (g.flags.cinder_lost_two) t += `Two of the miners from the refuge chamber did not make it out. You carry their names with you.

`;
    t += `The seven-note hum comes in over the miners’ radios as you walk back to the shuttle. It is faint, but unmistakable. Every handset on the terraces carries it at once, a soft, patient chord from nowhere.

[[ HALO // Cinder mission complete. The seven notes are getting louder. ]]`;
    return t;
  },
  ch: [
    { t: 'Return to the Perihelion.', go: 'hub', fx: [] }
  ]
};

/* ===== CHAPTER FOUR: VEYRA ===== */

S.c4_start = {
  eb: 'Chapter Four · CSV Perihelion', title: 'The Canopy',
  fx: [['loc', 'CSV Perihelion · Briefing Room', 'academy'], ['codex', 'veyra_c'], ['codex', 'vess']],
  t: `Captain Anselm waits until Kesh has sat down before she speaks. It is a small courtesy. Kesh notices it.

@Captain Anselm: “Veyra. A jungle-moon, seven Vess clans, one Concord survey team that has not reported in nine days. Dr. Ilse Maren and her six assistants went into the Hollow Grove to map a Vael ruin.” She slides a tablet across the table. “The Vess elders have not refused us. They have *asked for a speaker*. Someone who can stand before the Seven Reeds Clan and say what the Concord wants.”

She looks at Kesh. Kesh looks at the table.

@Kesh: “It is a custom of my people. A speaker who is not Vess must be vouched for by one who is.” Her wrists pulse a slow, nervous gold. “I will be that voice. I have not been home in four years. I did not leave kindly.”

@Dex: “Wait. You *left*? I thought you were, like, an ambassador.”

@Kesh: “I was a disappointment, with an excellent scholarship.”

@Tamsin: “We’re coming with you.”

Kesh does not answer. But the gold at her wrists steadies.`,
  ch: [
    { t: 'Ask Kesh what the Hollow Grove is.', go: 'c4_start', once: true, fx: [['xpl', .03], ['flag', 'asked_grove'], ['log', 'Kesh: the Hollow Grove is forbidden ground. Vael bones, and something that sings.']] },

};

S.c4_orbit = {
  eb: 'Chapter Four · Veyra Orbit',
  fx: [['loc', 'Veyra · High Orbit', 'veyra'], ['visit', 'veyra']],
  t: `Veyra comes up out of the dark like a held breath: green, amber, ringed with a thin pale haze of cloud. Even from orbit the canopy is a texture, an enormous felted moss a thousand kilometers wide.

The Perihelion drops out of the Skein and every alarm on the bridge starts shouting at once.

@Lt. Pike: “Contacts! Three, low, closing fast. No transponder.”

@Captain Anselm: “Pirate skiffs. They have been preying on survey runs.” Her voice does not change. “Cadet, you have the guns. Do not make me regret this.”

Three needle-nosed gun-boats scream out of the planet’s shadow, trailing exhaust like frayed thread.`,
  ch: [{ t: 'Man the gunnery station.', fight: F(['pirateskiff', 'pirateskiff'], 'c4_land', { intro: 'The Perihelion’s old guns spin up. Shields flicker to the left.', ship: true }) }]
};

S.c4_land = {
  eb: 'Chapter Four · Veyra',
  fx: [['loc', 'Veyra · Sevenreed Landing', 'veyra'], ['xpl', .06]],
  t: `Veyra smells like rain on warm stone.

The shuttle sets down on a lattice of living branches wide enough to hold a city. Everything is green and humming. Bioluminescent moss lights the underside of the leaves like stained glass. Somewhere far below, water the color of strong tea moves in the dark.

Kesh steps off the ramp first. She stops. For several heartbeats she does not move at all.

Then the trees *answer*. A low sweet chord rolls out of the branches overhead, seven notes stacked and swaying. It is the hum you have been hearing on every comm channel since Cinder. But here it is not a threat. Here it is a welcome.

@Kesh: “They know I am here.” Her voice is barely audible. “They have always known.”

A tall Vess in a robe of woven reed descends a spiral of vines. Her skin glows a pale, steady silver. This is Elder Maelith, speaker of the Seven Reeds Clan, and Kesh’s mother.

@Elder Maelith: “Daughter.” A pause long enough to hurt. “You have brought guests.”`,
  ch: [
    { t: 'Stay back. Let Kesh speak first.', go: 'c4_elder', fx: [['aff', 'kesh', 1], ['xpl', .03]] },
    { t: 'Step forward and greet the Elder in the Vess manner.', chk: {
        s: 'presence', dc: 12, sk: 'diplo', trk: 'tactician', label: 'Vess courtesy',
        ok: { t: 'You offer both hands, palms up, and hold the sound of your name in your throat for exactly one breath. Maelith’s glow warms by a shade. “Someone has taught you,” she murmurs. “Kesh. Good.”', fx: [['aff', 'kesh', 1], ['xpl', .06], ['flag', 'vess_courtesy']], go: 'c4_elder' },
        bad: { t: 'You bow, which is wrong. Several watching Vess go still. Maelith lets it pass with a thin smile.', fx: [['xpl', .02]], go: 'c4_elder' }
      } }
  ]
};

S.c4_elder = {
  eb: 'Chapter Four · The Speaking Hall',
  fx: [['loc', 'Veyra · Speaking Hall of Seven Reeds', 'veyra']],
  t: `The Speaking Hall is a cathedral of woven living wood. Vess stand in tiers around its rim, silver and gold and pale green, watching in perfect silence.

Maelith does not sit. She lets her daughter stand in front of her, and the whole hall waits.

@Elder Maelith: “Your Concord team entered the Hollow Grove nine days ago. We told them not to. They went anyway. We have heard singing from the Grove since. Not our song.” She lays a hand on the carved post beside her. “The grove-guard has been broken. Something has been *growing* in the Hollow. Something that is neither Vess nor beast nor Vael.”

@Kesh: “Mother. We came to help.”

@Elder Maelith: “You came to be *tested*.” The glow at her throat flickers once. “A Vess does not walk into the Hollow unvouched. You will each face the Trial of Truth. Three questions. We never lie. You must not either.”

@Dex: “Okay, I’m going to be honest and say I do not like that.”

@Elder Maelith: “That is the first thing you have said that I can use.”`,
  ch: [{ t: 'Accept the Trial of Truth.', go: 'c4_trial' }]
};

S.c4_trial2 = {
  eb: 'Chapter Four · The Trial of Truth',
  t: `The second question is for the squad.

@Elder Maelith: “Tamsin Okoro-Vale. Do you trust this one?” She nods at you.

@Tamsin: (very quietly) “I did not, at first.” She does not look at you. “I do now. That is... new for me.”

A ripple of approval moves around the hall. Maelith turns.

@Elder Maelith: “Dexter Ibarra. Are you brave?”

@Dex: “No!” The hall hums in what might be amusement. “But I do it anyway? I think that is the part that counts?”

@Elder Maelith: “It is.”

The third question is for Kesh. The Elder does not say it. She waits.`,
  ch: [
    { t: 'Stay silent. This is Kesh’s to answer.', go: 'c4_trial3', fx: [['aff', 'kesh', 1]] },
    { t: 'Offer to answer for her.', go: 'c4_trial3', fx: [['aff', 'kesh', -1], ['xpl', .03]] }
  ]
};

S.c4_trial3 = {
  eb: 'Chapter Four · The Trial of Truth',
  t: `@Elder Maelith: “Kesh-of-Seven-Reeds. Why did you leave?”

The hall is as still as a held note.

@Kesh: “Because I was afraid that if I stayed, I would only ever be what you wanted me to be.” Her voice does not shake. “Because I heard something in the Lantern’s song that frightened the Clan, and I wanted to learn what it meant. Because I wanted to see the stars, and I wanted to see what lived under them.” A breath. “And I am sorry, Mother. I am sorry I did not say goodbye.”

For a long moment nobody moves.

Then Maelith’s glow shifts. Silver, then gold, then a deep slow green that only the oldest Vess can produce.

@Elder Maelith: “*That* is a true answer.” She lifts her hands. The hall breaks into a soft rising chord. “Seven Reeds claims you again, daughter. If you will have us.”

Kesh covers her mouth. Her wrists are glowing like lanterns.`,
  ch: [
    { t: 'Smile. Say nothing.', go: 'c4_gift', fx: [['aff', 'kesh', 2], ['xpl', .08]] },
    { t: 'Offer her your shoulder.', go: 'c4_gift', fx: [['aff', 'kesh', 3], ['xpl', .08], ['flag', 'kesh_comforted']] }
  ]
};

S.c4_gift = {
  eb: 'Chapter Four · The Speaking Hall',
  fx: [['xpl', .08], ['codex', 'reed']],
  t: (g) => `Afterward Maelith leads you to a low room warm with lamplight. There is tea. It tastes of smoke and sweet bark.

${g.flags.kesh_comforted ? 'Kesh has not let go of your sleeve in several minutes. She does not seem to have noticed.' : 'Kesh sits straight and quiet, the way someone does when they are holding a great deal.'}

@Elder Maelith: “The Hollow Grove is three days’ walk down the Sevenreed Bough. Hunters of my clan will guide you as far as the Fall. Past that, you walk alone.” She pauses. “My daughter’s people grow their tools. I will ask the Weavers to grow you something.”

${g.flags.vess_courtesy || (g.aff.kesh||0) >= 5 ? 'Within the hour a young Weaver presents you with a long package wrapped in green silk. Inside lies a blade of living crystal, humming faintly, and a mantle woven from the same reed.\n\n[[gold: Gift of the Seven Reeds ]]' : 'A young Weaver brings a plain bundle of reed-woven cloth. It is a gift of respect, if not yet of trust.'}

};

  fx: [['loc', 'Veyra · Sevenreed Bough', 'veyra'], ['day', 1]],
  t: `The Bough is a road of living wood, three days long, running through the canopy like a spine. By day it is a tunnel of green light. By night it glows. The Vess hunters leave you at the Fall, a vertical river of luminous water, and do not look back.

On the second day the forest goes wrong. Leaves hang motionless in still air. Birdsong stops mid-phrase. A cloud of glowmoths rises from the underbrush, drifting, hypnotic, bright as sparks.

S.c4_grove_gate = {
  eb: 'Chapter Four · The Hollow Grove',
  fx: [['loc', 'Veyra · The Hollow Grove, Gate', 'veyra'], ['xpl', .08]],
  t: `The Hollow Grove begins where the trees stop growing upward. Their trunks bend inward over the clearing, locking into a vault of wood and bone. Pale Vael structures jut from the roots, smooth as a river stone, humming with a pitch that sets your teeth on edge.

Dr. Maren’s survey camp is here, abandoned. Tents torn. Instruments scattered. A Concord rifle lies in the dirt beside a half-eaten ration bar.

@Tamsin: “They didn’t run. They were *taken*.”

Footprints lead into the Grove. Many of them are human. Some are not.

A group of Vess hunters stands in a tight ring around the entrance. Their glow is dim. Their eyes are the wrong color. They are not guarding the Grove. They are guarding what is *inside*.

S.c4_grove_in = {
  eb: 'Chapter Four · The Hollow Grove',
  fx: [['loc', 'Veyra · The Hollow Grove, Heart', 'veyra'], ['xpl', .1], ['codex', 'vael']],
  t: `The grove opens into a bowl of pale roots and slow light. At its center a Vael structure the size of a house stands half-buried, ribbed like a whale’s skeleton. A faint tone rolls out of it, the seven notes, but warped. Wrong. A broken chord.

Dr. Ilse Maren sits against one rib, alive, hollow-eyed, tapping a stylus against her datapad in rhythm with the sound. Around her sit her six assistants, all humming the broken chord without seeming to know it.

Around *them*, in the shadows, things are moving. Hollow Skimmers, scrap-built, weaving in and out of the roots like insects.

@Dr. Maren: (without looking up) “It’s beautiful, isn’t it? It’s telling me where the Lantern is. It’s telling me what it *wants*.”

@Kesh: “Dr. Maren. You are being sung to. Please stand.”

@Dr. Maren: “I... can’t. Isn’t that funny?”`,
  ch: [
    { t: 'Fight through the skimmers and pull her out.', fight: F(['hollowskimmer', 'hollowskimmer', 'strangler'], 'c4_tuning', { intro: 'The skimmers whine. Roots clutch at your boots.' }) }

};

S.c4_tuning = {
  eb: 'Chapter Four · The Hollow Grove',
  fx: [['xpl', .1]],
  t: `The skimmers fall. The broken chord does not stop.

@Dex: “If I pull that, will it stop?”

@Kesh: “It might. It might also scream.” She looks at the shard, then at you. “Or it can be *tuned*. A Vess song can bring a broken chord back into harmony. But it is a hard thing. It takes all seven notes at once.”

        bad: { t: 'The shard screams, a sound that is inside your skull, and tears free. You stagger, bleeding from the nose.', fx: [['hp', -14], ['flag', 'shard_taken'], ['xpl', .05]], go: 'c4_thornback' }

        ok: { t: `Kesh closes her eyes. She sings the broken chord, note by note, and where each note is wrong she turns it right. Seven times. Seven voices of the Clan answer from the dark, the freed hunters among them.

S.c4_thornback = {
  eb: 'Chapter Four · The Hollow Grove',
  t: `The roots tremble.

The ground rises beneath the clearing, slowly, as if something enormous were turning over in its sleep. A wall of vines peels back from the trees. Behind it, an animal.

It is the size of a hangar. Plated in bark and bone, crowned with hooked thorns. Its eyes, the wrong color, are the same sickly gold as the hunters’.

@Kesh: “Mother Thornback.” She is barely audible. “She is the Grove’s guardian. She was *kind* once. The Hollow has made her angry.”

@Dr. Maren: (hoarse) “Get us out of here. Please.”

The Thornback roars. The forest roars back.`,
  ch: [{ t: 'Defend the survivors.', fight: F(['thornback'], 'c4_after', { intro: 'Mother Thornback charges, trunk-thick limbs shattering roots.', sc: 1 }) }]

S.c4_after = {
  eb: 'Chapter Four · Aftermath',
  fx: [['xpl', .15], ['cr', 300], ['item', 'w_reed'], ['item', 'a_reed'], ['ach', 'ch_veyra'], ['day', 4], ['act', 4], ['visit', 'veyra'], ['next', 'c5_start', 'Halcyon Drift: The House Always Wins', 'Dex owes the Syndicate. The Syndicate owes nobody. Both facts are about to become your problem.'], ['log', 'Saved Dr. Maren’s team and calmed the Hollow Grove.']],
  t: (g) => `Mother Thornback lowers her great head. The gold in her eyes drains. For a moment she looks, absurdly, *tired*. Then she turns and lumbers back into the roots, and the Grove exhales.

${g.flags.shard_tuned ? 'The Vael shard glows a steady, gentle gold in Kesh’s hand. The song that rises from the trees is the first the Grove has sung in a thousand years.' : 'The shard in your pack hums weakly. It is quieter, but it is not at peace.'}

Dr. Maren weeps and laughs and cannot stop. Her assistants stagger forward and are caught by Vess hands. The hunters, freed, kneel before Kesh without a word.

@Elder Maelith: (arriving at last with half the clan) “My daughter.” She looks at Kesh for a very long time. “You came home, and you brought the song with you.”

@Kesh: “I found the song out there. I think it was always calling me.” She meets her mother’s eyes. “I have to go again. There is more of it than this.”

@Elder Maelith: “I know.” A hand on her cheek. “Go. We will keep the light on.”

The Seven Reeds sing you back to the shuttle, and the whole canopy sings with them.

[[ HALO // Veyra mission complete. The Lantern’s signal has a direction now. ]]`,
  ch: [{ t: 'Return to the Perihelion.', go: 'hub' }]
};

S.c5_start = {
  eb: 'Chapter Five · CSV Perihelion', title: 'The House Always Wins',
  fx: [['loc', 'CSV Perihelion · Briefing Room', 'academy'], ['codex', 'halcyon_c'], ['codex', 'syndicate']],
  t: `The Shard from Veyra sits in a containment cradle on the briefing table, humming faintly. Pike has put a coffee cup next to it, then looked at the cup, then moved the cup.

@Captain Anselm: “Dr. Maren’s notes and the shard point to the same thing. A Vael data-slate called the Glass Codex. It holds the Lantern’s navigation map, the only one that has ever existed.” She taps the table. “It was sold eleven years ago to a collector. The collector died. The estate went to the Drift Syndicate.”

@Tamsin: “Halcyon Drift.”

@Captain Anselm: “Halcyon Drift.”

Dex has gone grey. He is holding a bolt in his fist so tightly it has stopped being a bolt.

@Dex: “So, uh. There is something I should tell everybody.” He swallows. “I may have, um, borrowed forty thousand credits from Matron Brandt to pay for my mother’s surgery when I was fourteen. And I may have, um, signed with my real name. And left the planet. At night. In a cargo crate.”

S.c5_tower = {
  eb: 'Chapter Five · The Matron’s Tower',
  fx: [['loc', 'Halcyon Drift · Brandt Tower', 'halcyon'], ['xpl', .08], ['codex', 'brandt']],
  t: `Brandt Tower is the tallest structure in the Drift, a black needle of glass and steel at the center of the inner ring. A private lift whisks you up through forty floors of gambling halls and bank vaults to a rooftop garden under a dome of smoked glass.

Matron Ossa Brandt is smaller than you expected. Silver-haired, soft-spoken, wearing a cardigan. She is trimming a bonsai with great care.

@Matron Brandt: “Dexter.” She does not look up. “You grew.”

S.c5_offer = {
  eb: 'Chapter Five · The Matron’s Tower',
  t: `The Matron listens to you explain, without interrupting. She sips her tea. She asks one question about Veyra and two about the Lantern. When you finish she sets her cup down.

@Matron Brandt: “The Glass Codex is in my deepest vault, behind two Gorgons and a very expensive lock. I do not give away what I own. But I am a fair woman.” She smiles, and the smile is genuine, which is worse. “I will offer you three ways to leave this tower happy.”

She holds up one finger.

@Matron Brandt: “One. You do me a small favor. There is a rival fixer named Skarn, running games in my ring without paying his tithe. Remove him. I will hand you the Codex and forget the debt entirely.”

A second finger.

@Matron Brandt: “Two. You pay. Five thousand credits for the Codex, and the boy’s debt, in full, at a generous discount.”

A third.

@Matron Brandt: “Three. You try to *take* it. I wish you luck. I would also like you to know that my vault has killed forty-one thieves, and I buried each of them personally.”

S.c5_deal = {
  eb: 'Chapter Five · Skarn’s Den',

S.c6_start = {
  eb: 'Chapter Six · CSV Perihelion', title: 'The Ghost Ship',
  fx: [['loc', 'CSV Perihelion · Captain’s Mess', 'academy'], ['codex', 'glasswake_c'], ['codex', 'glasswake_m']],
  t: `The Captain’s mess is the smallest room on the Perihelion and the only one with a door that actually closes. Anselm closes it.

She does not sit. She stands at the viewport with her hands clasped behind her, as though bracing for a lecture she is about to give herself.

@Captain Anselm: “Twenty-two years ago I was First Officer of the CSV Ardent. Nine hundred meters of the best armor the Concord could forge. We were sent to Glasswake to answer a distress call.” She does not turn. “The call was a trap. Not a pirate trap. Something *older*. The Ardent was boarded by things that wore the faces of our own crew. Captain Veyl ordered the ship sealed. Six hundred people on board. I was ordered off with the wounded.”

A very long pause.

@Captain Anselm: “I obeyed.”

@Pike: (gently) “Captain. You were following orders.”

@Captain Anselm: “Yes. I have told myself so for twenty-two years.” She faces you at last. “The Codex says the Lantern’s map lies in the Ardent’s navigation core. I will not order you into that ship. I would like to ask.”

S.c6_start2 = {

  t: `@Captain Anselm: “I saw my friends walk down the corridor toward me. They were smiling. They were saying my name.” She pauses. “Some of them still had their wounds. Some of them were *singing*.”

  t: `The Lantern’s map ends the way maps do when the cartographers lose their nerve: with a line, and a note that says *here be something*.

@Tamsin: “Who commands Cairn?”

@Soren Hale: “Colonel Aurel Hale.” His tone is crisp as a drawn blade. “My father. I volunteered to liaise. I also volunteered to not discuss it.”

  t: `Fort Cairn is a stack of rust-colored walls on a mesa, flying a Concord flag that has been bleached nearly white by the sun. Garrison troops line the parapet. Heat shimmers off the stone.

  t: `The whole crew is on the bridge. Pike, the engineers, the cooks, a cat nobody admits to owning. Anselm stands at the helm with her hands on the rail.

@Captain Anselm: “The Dark Between. Eleven jumps. Every ship that has tried it has come back silent.” She smiles, thin and fierce. “We have a map, a Codex and a squad of cadets who have somehow survived every plan I did not make for them. I like our odds better than I should.”

@Captain Anselm: “It is the only one I have.”

@Captain Anselm: “Cadet {name}. When we reach the Lantern, I will keep the Perihelion in orbit. What happens on the surface is yours. I will not give you orders. I will give you my trust.” A pause. “It is a very small gift. It is all I have left.”

S.c8_dark = {
  eb: 'Chapter Eight · The Dark Between',
  fx: [['loc', 'The Dark Between · Approach', 'lantern'], ['visit', 'lantern']],
  t: `Eleven jumps. Each one pulls a little further. Each one leaves the stars a little thinner. By the sixth, the viewports show only black. By the ninth, even the Skein feels *quiet*.

On the tenth jump, the Lantern’s song begins to sing through the hull. Not a hum. A chord. Seven notes, perfect, enormous, and underneath them something that is not music, a pressure like a held breath.

@Kesh: “It knows we are here.”

On the eleventh jump, the Perihelion emerges into a nothing so complete that the instruments stop reporting. In the middle of it floats a star, tiny, dying, red. And in orbit around that star, impossibly, a lighthouse.

const rf = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function makeGame(o) {
  const stats = { might: 3, reflex: 3, intellect: 3, resolve: 3, presence: 3 };
  const tr = D.TRACKS[o.track], bg = D.BG[o.bg];
  for (const k in tr.b) stats[k] += tr.b[k];
  for (const k in bg.b) stats[k] += bg.b[k];
  const g = {
    v: 1, name: o.name, call: o.call, bg: o.bg, track: o.track,
    lvl: 1, xp: 0, sp: 0, ap: 0, stats,
    hp: 1, sh: 0, fc: 0, cp: 3, cr: bg.cr,
    inv: { medkit: 2, shieldcell: 1 }, eq: { weapon: tr.w, armor: tr.a, module: null, implant: null },
    skills: {}, flags: {}, aff: { tamsin: 0, dex: 0, kesh: 0, soren: 0 }, rep: { concord: 0, hegemony: 0, drift: 0, vess: 0 },
    kills: 0, bosses: 0, crits: 0, killsBy: {}, ach: {}, codex: {}, once: {}, talked: {}, log: [],
    scene: 'p0', mode: 'scene', loc: 'Longwatch Station', world: 'academy', day: 1, hubName: 'Longwatch Station', act: 1,
    next: null, squad: [], met: {}, visited: { academy: 1 },
    t: { flawless: 0, clutch: 0, maxhit: 0, skillchain: 0, orders: 0, itemsUsed: 0, defeats: 0, sims: 0, bought: 0, sold: 0, rerolls: 0, checksWon: 0, nat20: 0, nat1: 0 },
    rw: [], checkpoint: null, chk: null, ts: Date.now()
  };
  tr.sk.concat(bg.sk).forEach(k => g.skills[k] = 1);

function eff(g, k) {
  let v = g.stats[k];
  for (const s of Object.values(g.eq)) if (s && D.IT[s].mods && D.IT[s].mods[k]) v += D.IT[s].mods[k];
  return v;
}
function gm(g, k) {
  let v = 0;
  for (const s of Object.values(g.eq)) if (s) { const m = D.IT[s].mods; if (m && m[k]) v += m[k]; }
  return v;
}
function calc(g) {

/* ===== LONGWATCH — engine part 2: combat ===== */

/* ----- status helpers ----- */
function addP(k, t, n) { C.P.st[k] = { t: t, n: n || 0 }; if (k !== 'guard' && k !== 'dodge') clog('You gain ' + STNAME[k] + '.', 'g'); else clog('You ' + (k === 'guard' ? 'brace.' : 'prepare to dodge.'), 'g'); }
function healP(a) { const pc = calc(); const b = G.hp; G.hp = Math.min(pc.hpMax, G.hp + a); clog('You recover ' + (G.hp - b) + ' HP.', 'g'); }

  if (Math.random() >= c) return false;

}
function weakestType(f) { let best = 'kinetic', v = 9; for (const k in D.DT) { const r = f.b.res[k] || 0; if (r < v) { v = r; best = k; } } return best; }

/* ----- damage ----- */
function playerHit(f, m, o) {
  o = o || {};

  const dt = o.dt || w.dt;

  if (Math.random() > acc) return { miss: true };
  let d = (rnd(w.dm[0], w.dm[1]) + pc.st[w.sc] * 1.25) * m * (1 + pc.dmg);

  }

  G.t.maxhit = Math.max(G.t.maxhit, d);

/* ----- squad ----- */
function orderCd(w) { return Math.max(1, D.CREW[w].cd - (G.skills.commandpres ? 1 : 0)); }

    case 'dex': { clog('Dex: "Overcharging! Don\'t touch anything!"', 'y'); const a = Math.round(pc.shMax * .3 * pot); G.sh = Math.min(pc.shMax, G.sh + a); clog('Shields +' + a + '.', 'g'); C.P.st.fury = { t: 3, n: 0 }; clog('You gain Fury.', 'g'); break; }

  else {
    const m = G.mode;
    let h;
    if (m === 'combat') h = combatView();

/* ---------- starfield ---------- */
function stars() {
  const cv = $('#stars'); if (!cv || !cv.getContext) return;
  let ctx; try { ctx = cv.getContext('2d'); } catch (e) { return; } if (!ctx) return;
  let w = 0, h = 0; const N = 110; const st = [];
  const still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size() { w = cv.width = innerWidth; h = cv.height = innerHeight; }
  size(); window.addEventListener('resize', size);
  for (let i = 0; i < N; i++) st.push({ x: Math.random(), y: Math.random(), z: Math.random() * .9 + .1, tw: Math.random() * 6 });
  let t = 0;
  function draw() {
    ctx.clearRect(0, 0, w, h);
    for (const s of st) {
      const a = .25 + .5 * s.z * (.7 + .3 * Math.sin(t * .02 + s.tw));
      ctx.fillStyle = 'rgba(220,230,255,' + a + ')';
      const r = .4 + s.z * 1.2; ctx.fillRect(s.x * w, s.y * h, r, r);
      if (!still) { s.x -= .00005 * s.z; if (s.x < 0) s.x = 1; }
    }
    t++; if (!still) requestAnimationFrame(draw);
  }
  draw();
}
